name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ !github.event.repository.private }}
    name: ci / matrix
    uses: swift-institute/.github/.github/workflows/swift-ci.yml@508e1b6d3d7c0c95249245d3a777429ad80cb08c
